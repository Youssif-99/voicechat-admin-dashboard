name: voice_app
description: Voice Chat App — Flutter client with dynamic icon management and realtime admin events
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client — lightweight, testable
  http: ^1.2.1

  # SVG rendering — required for DynamicIcon
  flutter_svg: ^2.0.10+1

  # File system path helpers
  path: ^1.9.0

  # Platform-specific cache directories (getTemporaryDirectory)
  path_provider: ^2.1.3

  # Realtime admin event listener (Socket.IO)
  # Receives events from Express when admin changes icons, bans users, etc.
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    # Bundled fallback icons — used when remote icons are unavailable.
    # Key format: nav.home → assets/icons/fallback/nav_home.svg
    - assets/icons/fallback/
    # Bundled fallback assets — used when remote AppAssets are unavailable.
    # Key format: home_icon → assets/assets/fallback/home_icon.png
    - assets/assets/fallback/
